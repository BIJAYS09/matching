version: '3.9'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: defense_matching_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: defense_matching
    ports:
      - "5432:5432"

  api:
    build: .
    container_name: defense_matching_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - .:/app